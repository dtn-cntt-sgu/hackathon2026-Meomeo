/* ==================== DESIGN TOKENS (TASTESKILL 2.5) ==================== */

  --on-accent: #ffffff;
  
  --duo-green: #16a34a;
  --duo-green-dark: #15803d;
  --duo-green-bg: rgba(22, 163, 74, 0.12);
  
  --ready: #d97706;
  --ready-bg: rgba(217, 119, 6, 0.1);
  --done: #059669;
  --done-bg: rgba(5, 150, 105, 0.1);

:root {

  --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-snap: cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 var(--font-sans);
  letter-spacing: -0.011em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background .2s var(--ease-snap), color .2s var(--ease-snap);
}

/* ==================== MICRO-INTERACTION BUTTONS & HOVER ==================== */
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: none;
  background: transparent;
  padding: 0;
  user-select: none;
  transition: transform .18s var(--ease-spring),
              background .18s var(--ease-spring),
              border-color .18s var(--ease-spring),
              filter .18s var(--ease-spring);
}
button:disabled { cursor: not-allowed; opacity: .45 !important; transform: none !important; box-shadow: none !important; }

/* Quy tắc nhấn (Press) và nhấc (Lift 2px) cho tất cả các nút tương tác */
.btn, .tbtn, .chip, .qchip, .slice, .sum-item, .ftab, .rtab, .seg button {
  will-change: transform;
}
.btn:active:not(:disabled), .tbtn:active:not(:disabled), .chip:active:not(:disabled),
.qchip:active:not(:disabled), .slice:active:not([aria-disabled="true"]), .sum-item:active {
  transform: translateY(1px) scale(0.98) !important;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
code {
  font-family: var(--font-mono);
  font-size: .88em;
  background: var(--panel2);
  border: none;
  padding: 1.5px 6px;
  border-radius: 5px;
  color: var(--accent);
}
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Thanh cuộn tinh tế */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--panel3); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ==================== THANH ĐIỀU HƯỚNG COCKPIT TOP ==================== */
.top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  background: var(--panel);
  border-bottom: none;
  flex: none;
  z-index: 20;
}
.brand-wrap {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 14.5px;
  letter-spacing: -0.02em;
}
.brand-icon {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--accent), #6366f1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
}
.repo-crumb {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  padding: 3px 10px;
  border: none;
  border-radius: 8px;
  background: var(--panel2);
  color: var(--muted);
}
.repo-crumb b { color: var(--text); font-weight: 600; }
.metric-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--faint);
  padding: 3px 8px;
  border-radius: 6px;
  background: var(--panel2);
  border: none;
}
.metric-chip .live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--done);
  box-shadow: 0 0 6px var(--done);
}
.spacer { flex: 1; }

.tbtn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--panel2);
  border: none;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
}
.tbtn:hover {
  background: var(--panel3);
  transform: translateY(-2px);
}
.tbtn.icon { padding: 6px 9px; }
.tbtn[aria-pressed="false"] { opacity: .6; }

/* ==================== BỐ CỤC BUỒNG LÁI (COCKPIT 3 CỘT) ==================== */
.main {
  padding: 12px;
  gap: 12px;
}
.col {
  background: var(--panel);
  border: none;
  border-radius: 12px;
  min-width: 0;
  box-shadow: var(--shadow-sm);
  transition: background .2s;
}
.col:hover { background: var(--panel); }

@media (min-width: 1024px) {
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr); }
  .col { min-height: 0; overflow: auto; }
  .col-mid { overflow: hidden; }
}
@media (max-width: 1023.98px) {
  .main { display: flex; flex-direction: column; }
  .col-mid { position: sticky; top: 0; z-index: 10; height: min(440px, 54vh); overflow: hidden; }
  .top .brand-wrap span { display: none; }
  .metric-chip { display: none; }
}

.pane { padding: 16px; }
.pane-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}

/* ==================== BẢN ĐỒ BÀI HỌC CỘT TRÁI ==================== */
.grp {
  margin-bottom: 12px;
  border: none;
  border-radius: 10px;
  background: var(--bg);
  overflow: hidden;
  transition: background .2s;
}
.grp:hover { background: var(--bg); }
.grp-h {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel2);
  padding: 10px 12px;
  text-align: left;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
  border: none;
}
.grp-h:hover {
  background: var(--panel3);
}
.grp-h[aria-expanded="true"] { border: none; }
.grp-h .chev {
  display: inline-block;
  font-size: 11px;
  color: var(--muted);
  transition: transform .2s var(--ease-spring);
}
.grp-h[aria-expanded="true"] .chev { transform: rotate(90deg); color: var(--accent); }
.gname { font-weight: 600; }
.badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--ready-bg);
  border: none;
  color: var(--ready);
}
.cnt { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; }
.grp-b { padding: 10px; display: grid; gap: 8px; }

/* Thẻ lát cắt kiến trúc (Slice Card) */
.slice {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--panel);
  border: none;
  border-radius: 10px;
  padding: 10px 12px;
  position: relative;
}
.slice:hover {
  transform: translateY(-2px);
  background: var(--panel2);
}
.slice.sel {
  background: var(--panel2);
  box-shadow: none;
}
.slice.sel::before {
  content: '';
  position: absolute;
  left: 0;
  top: 10px;
  bottom: 10px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--accent);
}
.slice[aria-disabled="true"] { opacity: .6; }
.s-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.s-name { font-size: 14px; font-weight: 600; color: var(--text); }
.star { color: var(--ready); font-size: 11px; font-weight: 600; }
.ai-tag {
  font-size: 10px;
  font-weight: 500;
  color: var(--muted);
  border: none;
  border-radius: 999px;
  padding: 1px 7px;
  background: var(--panel2);
}
.s-code {
  display: block;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 3px;
  word-break: break-all;
}
.s-st {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 8px;
  font-size: 12px;
  font-weight: 600;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
  flex: none;
  box-shadow: 0 0 6px currentColor;
}
.st-ready .s-st { color: var(--ready); }
.st-done .s-st { color: var(--done); }
.st-fail .s-st { color: var(--fail); }
.st-locked .s-st { color: var(--locked); }
.need {
  margin-top: 8px;
  font-size: 12px;
  color: var(--muted);
  border-top: none;
  padding-top: 6px;
}
.pop-fx { animation: pop .6s var(--ease-spring); }

/* ==================== CỘT GIỮA CODE STUDIO ==================== */
.mid-frame { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.ftabs {
  display: flex;
  background: var(--panel2);
  border-bottom: none;
  overflow-x: auto;
  flex: none;
}
.ftab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: none;
  padding: 10px 16px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  color: var(--muted);
  white-space: nowrap;
}
.ftab:hover {
  color: var(--text);
  background: var(--panel3);
  transform: translateY(-1px);
}
.ftab[aria-selected="true"] {
  background: var(--code-bg);
  color: var(--accent);
  font-weight: 600;
}
.weak-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--fail);
  box-shadow: 0 0 6px var(--fail);
}
.fpath {
  padding: 6px 16px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--muted);
  background: var(--code-bg);
  border-bottom: none;
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.fpath::before {
  content: 'FILE:';
  font-size: 10px;
  font-weight: 700;
  color: var(--faint);
  letter-spacing: .05em;
}
.code-scroll {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: auto;
  background: var(--code-bg);
  color: var(--code-text);
  padding: 12px 0;
}
/* Màu bôi đen cho tab hiển thị code: #38bdf8 */
.col-mid *::selection,
.col-mid ::selection,
#mid *::selection,
#mid ::selection {
  background: #38bdf8 !important;
  color: #041424 !important;
}
.col-mid *::-moz-selection,
.col-mid ::-moz-selection,
#mid *::-moz-selection,
#mid ::-moz-selection {
  background: #38bdf8 !important;
  color: #041424 !important;
}
.ln {
  display: flex;
  border-left: none;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.8;
  white-space: pre;
  min-width: max-content;
  transition: background .15s;
}
.ln:hover {
  background: rgba(255, 255, 255, 0.03);
}
.ln .no {
  flex: none;
  width: 52px;
  padding-right: 14px;
  text-align: right;
  color: var(--gutter);
  user-select: none;
}
.ln .tx { padding-right: 16px; }
.ln .k { color: var(--kw); font-weight: 500; }
.ln .s { color: var(--str); }
.ln .fn { color: var(--fn); }

.ln.hl-step {
  background: var(--hl-step);
  border-left: none;
  animation: hlIn .22s ease;
}
.ln.hl-focus {
  background: var(--hl-focus);
  border-left: none;
  animation: hlIn .22s ease;
}
.ln.hl-good {
  background: var(--hl-good);
  border-left: none;
  animation: hlIn .22s ease;
}
.ln.hl-bad {
  background: var(--hl-bad);
  border-left: none;
  animation: hlIn .22s ease;
}
.gap {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--gutter);
  padding: 4px 0 4px 52px;
  font-style: italic;
  opacity: .8;
}

/* Bức tranh chung (Overview) */
.overview { padding: 28px; max-width: 680px; margin: 0 auto; }
.overview h2 { font-size: 22px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.02em; }
.overview .lead { color: var(--muted); font-size: 14.5px; line-height: 1.6; margin-bottom: 22px; }
.gcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 24px; }
.gcard {
  background: var(--panel2);
  border: none;
  border-radius: 10px;
  padding: 12px 14px;
  transition: transform .18s var(--ease-spring);
}
.gcard:hover { transform: translateY(-2px); }
.gcard b { display: block; margin-bottom: 4px; font-size: 14px; }
.gcard small { color: var(--muted); display: block; font-size: 12px; line-height: 1.5; }
.ov-wrap { height: 100%; overflow: auto; display: flex; align-items: center; }
.empty { padding: 32px 20px; color: var(--muted); text-align: center; }
.empty h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }

/* ==================== BỘ NÚT CHUẨN TASTESKILL ==================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--panel2);
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
}
.btn:hover:not(:disabled) {
  background: var(--panel3);
  transform: translateY(-2px);
}
.btn.primary {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
  border: none;
}
.btn.primary:hover:not(:disabled) {
  background: var(--accent-hover);
  transform: translateY(-2px);
  filter: brightness(1.06);
  box-shadow: none;
}
.btn.big { padding: 12px 20px; font-size: 14.5px; width: 100%; border-radius: 10px; }
.btn.small { padding: 4px 10px; font-size: 12px; border-radius: 6px; }

/* ==================== CỘT PHẢI X-RAY VÀ FEYNMAN ==================== */
.rtabs {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  background: var(--panel);
  border-bottom: none;
  padding: 0 12px;
}
.rtab {
  background: transparent;
  border: none;
  padding: 12px 18px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--muted);
}
.rtab:hover {
  color: var(--text);
  transform: translateY(-1px);
}
.rtab[aria-selected="true"] {
  color: var(--accent);
}

.stack { display: grid; gap: 14px; }
.enter .stack { animation: fadeUp .22s var(--ease-spring); }
.card {
  background: var(--panel2);
  border: none;
  border-radius: 10px;
  padding: 14px 16px;
}
.card:hover { background: var(--panel2); }
.card h2 { font-size: 16px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
.card p + p { margin-top: 6px; }
.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  border: none;
  border-radius: 999px;
  padding: 2px 8px;
  margin-left: 4px;
  background: var(--panel3);
  color: var(--text);
}
.banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--hl-focus);
  border: none;
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 13px;
}

/* Mini-diagram 3 tầng kiến trúc */
.arch-diagram {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--panel2);
  border: none;
  margin-bottom: 4px;
}
.arch-node {
  flex: 1;
  text-align: center;
  padding: 5px 6px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 600;
  background: var(--panel);
  border: none;
  color: var(--muted);
  transition: all .2s var(--ease-spring);
}
.arch-node.active {
  background: var(--accent);
  color: var(--on-accent);
  border: none;
  transform: scale(1.04);
}
.arch-arrow { color: var(--faint); font-size: 11px; flex: none; }

.stephead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stephead h2 { font-size: 15px; font-weight: 700; }
.dots { display: flex; gap: 6px; }
.dots i {
  width: 20px;
  height: 5px;
  border-radius: 3px;
  background: var(--panel3);
  transition: background .2s, transform .2s;
}
.dots i.on { background: var(--accent); transform: scaleY(1.2); }
.where { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.expl { font-size: 14.5px; line-height: 1.65; color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  background: var(--panel2);
  border: none;
  color: var(--text);
  border-radius: 999px;
  padding: 4px 13px;
  font-size: 12.5px;
  font-weight: 500;
}
.chip:hover {
  background: var(--accent);
  color: var(--on-accent);
  border: none;
  transform: translateY(-2px);
}
.navrow { display: flex; gap: 10px; justify-content: space-between; }
.keyhint { font-size: 12px; color: var(--faint); }

.sum-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sum-title.good { color: var(--done); }
.sum-title.bad { color: var(--fail); }
.sum-item {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--panel2);
  border: none;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 8px;
  position: relative;
}
.sum-item:hover {
  transform: translateY(-2px);
  background: var(--panel3);
}
.sum-item.good { box-shadow: inset 4px 0 0 var(--done); }
.sum-item.bad { box-shadow: inset 4px 0 0 var(--fail); }
.sum-item small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
.cons {
  margin: 4px 0 10px;
  padding: 10px 14px;
  border-radius: 8px;
  background: var(--hl-bad);
  border: none;
  font-size: 13px;
  color: var(--text);
}
.linkbtn {
  background: none;
  border: 0;
  padding: 2px 4px;
  color: var(--accent);
  font-size: 12.5px;
  font-weight: 600;
  text-decoration: underline;
  margin-bottom: 8px;
  display: inline-block;
}
.linkbtn:hover { color: var(--accent-hover); transform: translateY(-1px); }

/* ==================== FEYNMAN ARENA ==================== */
.seg { display: flex; border: none; border-radius: 9px; overflow: hidden; background: var(--panel2); }
.seg button {
  flex: 1;
  background: transparent;
  border: none;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}
.seg button:last-child { border: none; }
.seg button:hover { background: var(--panel3); color: var(--text); }
.seg button[aria-checked="true"] {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
}
.lbl { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; display: block; }
.qchips { display: flex; gap: 8px; }
.qchip {
  min-width: 48px;
  background: var(--panel2);
  border: none;
  border-radius: 999px;
  padding: 5px 16px;
  font-size: 14.5px;
  font-weight: 600;
}
.qchip:hover:not(:disabled) {
  background: var(--panel3);
  transform: translateY(-2px);
}
.qchip[aria-current="true"] {
  background: var(--accent);
  color: var(--on-accent);
  box-shadow: none;
}
.qchip.ok { color: var(--done); background: var(--done-bg); border: none; }
.qchip.no { color: var(--fail); background: var(--fail-bg); border: none; }
.qtext { font-size: 15px; line-height: 1.6; font-weight: 600; color: var(--text); }

textarea {
  width: 100%;
  min-height: 110px;
  resize: vertical;
  background: var(--code-bg);
  color: var(--text);
  border: none;
  border-radius: 8px;
  padding: 10px 12px;
  font: inherit;
  line-height: 1.6;
  transition: background .15s;
}
textarea:focus {
  outline: none;
  background: var(--panel2);
}
.subrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
.err { color: var(--fail); font-size: 12.5px; margin-top: 6px; font-weight: 500; }
.att { border: none; border-radius: 8px; background: var(--panel2); padding: 8px 12px; }
.att summary { cursor: pointer; font-weight: 600; font-size: 13px; }
.pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 999px;
  border: none;
  margin-left: 6px;
}
.pill.ok { color: var(--done); background: var(--done-bg); }
.pill.no { color: var(--fail); background: var(--fail-bg); }
.said { margin: 8px 0; padding: 8px 12px; border: none; background: var(--bg); border-radius: 6px; color: var(--muted); white-space: pre-wrap; font-size: 13px; }
.fb { margin: 6px 0; font-size: 13.5px; }
.hint { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: var(--hl-focus); border: none; font-size: 13px; }
.hint-act { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.sample {
  padding: 12px 14px;
  border-radius: 8px;
  border: none;
  background: var(--hl-good);
  font-size: 13.5px;
  line-height: 1.6;
}
.sample b { display: block; font-size: 12px; font-weight: 700; color: var(--done); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }

.delta { animation: fadeUp .25s var(--ease-spring); }
.delta .dname { font-size: 13px; margin-bottom: 6px; color: var(--muted); }
.delta .dname b { color: var(--text); }
.bar { position: relative; height: 10px; border-radius: 5px; background: var(--panel3); overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; display: block; }
.bar .base { background: var(--accent); width: var(--base); }
.bar .diff { left: var(--base); width: var(--diff); animation: grow .7s ease-out; }
.bar .diff.up { background: var(--done); }
.bar .diff.down { background: var(--fail); }

.result { border-radius: 10px; padding: 14px 16px; border: none; animation: fadeUp .25s var(--ease-spring); }
.result.done { background: var(--hl-good); }
.result.fail { background: var(--hl-bad); }
.result h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.result ul { margin: 8px 0 0; padding-left: 20px; font-size: 13px; }

/* ==================== POPOVER, OVERLAY & MODAL ==================== */
.pop {
  position: fixed;
  z-index: 60;
  width: min(400px, calc(100vw - 24px));
  max-height: calc(100vh - 24px);
  overflow: auto;
  background: var(--panel2);
  border: none;
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 16px 18px;
  animation: fadeUp .18s var(--ease-spring);
  backdrop-filter: var(--backdrop);
}
.pop h3 { font-size: 16px; font-weight: 700; padding-right: 28px; }
.pop h3 code { font-size: 11px; margin-left: 6px; }
.pop dt { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 10px; text-transform: uppercase; letter-spacing: .04em; }
.pop dd { margin: 3px 0 0; font-size: 13.5px; line-height: 1.55; }
.pop hr { border: 0; height: 1px; background: rgba(255, 255, 255, 0.08); margin: 12px 0 10px; }
.pop .ai b { color: var(--accent); }
.xbtn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: var(--panel3);
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.xbtn:hover {
  background: var(--panel2);
  color: var(--text);
  transform: translateY(-2px);
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: var(--overlay);
  backdrop-filter: var(--backdrop);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn .18s ease;
}
.modal {
  position: relative;
  background: var(--panel);
  border: none;
  border-radius: 16px;
  box-shadow: var(--shadow);
  max-height: calc(100vh - 32px);
  overflow: auto;
  animation: fadeUp .2s var(--ease-spring);
}
#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 16px);
  z-index: 90;
  max-width: min(520px, calc(100vw - 24px));
  background: var(--text);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s var(--ease-spring), transform .2s var(--ease-spring);
  font-size: 13.5px;
  font-weight: 500;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ==================== POPUP GIẢI THÍCH ĐOẠN CODE CHỌN ==================== */
.code-pop {
  position: fixed;
  z-index: 95;
  width: min(380px, calc(100vw - 32px));
  background: var(--panel2);
  border: none;
  border-radius: 14px;
  padding: 16px 18px;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75);
  color: var(--text);
  animation: fadeUp .18s var(--ease-spring);
  backdrop-filter: var(--backdrop);
  pointer-events: auto;
}
.code-pop-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  padding-right: 22px;
}
.code-pop-tag {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--accent);
  background: var(--hl-step);
  border: none;
  border-radius: 999px;
  padding: 3px 10px;
}
.code-pop-tag.warn {
  color: var(--ready);
  background: var(--ready-bg);
  border: none;
}
.code-pop-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.35;
  margin-bottom: 6px;
}
.code-pop-snippet {
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--code-bg);
  border: none;
  padding: 7px 11px;
  border-radius: 6px;
  color: var(--accent);
  margin-bottom: 8px;
  word-break: break-all;
  white-space: pre-wrap;
  line-height: 1.5;
}
.code-pop-body {
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.6;
}
.code-pop-body b {
  color: var(--text);
}
.code-pop-body code {
  font-size: 11.5px;
  color: var(--accent);
  background: var(--panel3);
  border: none;
}
.code-pop-action {
  margin-top: 12px;
  padding-top: 0;
  border-top: none;
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
}

/* ==================== DUOLINGO-STYLE GUIDED TOUR ==================== */
#tourOverlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  pointer-events: auto;
  animation: fadeIn .2s ease;
}
#tourBackdrop {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(4, 7, 13, 0.82);
  cursor: default;
}
@keyframes duoShake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-6px); }
  40%, 80% { transform: translateX(6px); }
}
.duo-shake {
  animation: duoShake 0.35s ease-in-out !important;
}
/* Khi đang trong tour: khóa toàn bộ click vào các nút trên trang */
body.in-tour #main,
body.in-tour .top {
  pointer-events: none !important;
  user-select: none !important;
}
body.in-tour #tourOverlay,
body.in-tour .duo-popup {
  pointer-events: auto !important;
}

/* Trong bước tương tác chọn code của tour: mở khóa vùng code để người dùng tô chọn */

body.in-tour #codeExplainBtn {

}

/* Nút Giải thích nhỏ nổi sau khi bôi đen mã */
.code-float-btn {
  position: fixed;
  z-index: 1025;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 26px;
  padding: 0 10px;
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .02em;
  color: var(--on-accent);
  background: var(--accent);

  border-radius: 999px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);

@keyframes codeFloatBtnIn {

/* Mũi tên nhấp nhô chỉ vào nút Tiếp theo */
.duo-next-group {

}

}

  from { transform: translateX(0); }

}
.tour-focused {

  z-index: 1005 !important;
  background: var(--panel) !important;
  border: none !important;
  outline: none !important;
  box-shadow: 0 0 35px 5px var(--accent-glow) !important;

}
.duo-popup {
  position: fixed;
  z-index: 1010;

html[data-theme="light"] .duo-popup {

}

/* Mũi tên tam giác chỉ hướng Duolingo */
.duo-popup::before {
  display: none !important;
}
.duo-popup::after {
  content: '';
  position: absolute;
  width: 0;
  height: 0;
  border-style: solid;
}
.duo-popup.arrow-right::after {
  right: -10px; top: 35px;
  border-width: 9px 0 9px 11px;
  border-color: transparent transparent transparent #111827;
}
.duo-popup.arrow-left::after {
  left: -10px; top: 35px;
  border-width: 9px 11px 9px 0;
  border-color: transparent #111827 transparent transparent;
}
.duo-popup.arrow-top::after {
  top: -10px; left: 35px;
  border-width: 0 9px 11px 9px;
  border-color: transparent transparent #111827 transparent;
}
.duo-popup.arrow-bottom::after {
  bottom: -10px; left: 35px;
  border-width: 11px 9px 0 9px;
  border-color: #111827 transparent transparent transparent;
}
html[data-theme="light"] .duo-popup.arrow-right::after { border-color: transparent transparent transparent #ffffff; }
html[data-theme="light"] .duo-popup.arrow-left::after { border-color: transparent #ffffff transparent transparent; }
html[data-theme="light"] .duo-popup.arrow-top::after { border-color: transparent transparent #ffffff transparent; }
html[data-theme="light"] .duo-popup.arrow-bottom::after { border-color: #ffffff transparent transparent transparent; }

.duo-tag {

  font-size: 11px;
  font-weight: 800;
  letter-spacing: .07em;

}

  font-weight: 800;
  line-height: 1.3;

}
html[data-theme="light"] .duo-body { color: #475569; }
.duo-footer {

}
.duo-btn-skip {

  border: none;

}
.duo-btn-skip:hover { color: #f8fafc; text-decoration: underline; }
.duo-btn-primary {

  border: none;

.duo-btn-sec {

.duo-btn-sec:hover { background: #374151; }

@keyframes duoBounce {
  0% { transform: scale(0.92); opacity: 0; }
  60% { transform: scale(1.02); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {

function synt(line){
  var out='', last=0, m; TOK.lastIndex=0;

}

/* ---- Feynman ---- */
function deltaHTML(q, qi){
  var sk=SCORE[QS[qi].skill], after = q.passed ? sk.up : sk.down;
  var lo=Math.min(sk.base, after), diff=Math.abs(after-sk.base);
  return '<div class="delta"><div class="dname">'+esc(sk.name)+': <b>'+sk.base+'% → '+after+'%</b> '+(q.passed?'(Tăng trưởng)':'(Cần ôn lại)')+'</div>'
    +'<div class="bar" role="img" aria-label="'+esc(sk.name)+' từ '+sk.base+' phần trăm lên '+after+' phần trăm"><i class="base" style="--base:'+lo+'%;width:'+lo+'%"></i>'
    +'<i class="diff '+(q.passed?'up':'down')+'" style="--base:'+lo+'%;--diff:'+diff+'%;left:'+lo+'%;width:'+diff+'%"></i></div></div>';
}
function hintHTML(a, isLast, qi){
  if(!a.hint) return '';
  if(a.hint==='concept') return '<div class="hint"><b>Gợi ý khái niệm:</b> '+esc(QS[qi].concept)+'</div>';
  return '<div class="hint"><b>Gợi ý mã nguồn:</b> '+md(CODE_HINT)
    +(isLast?'<div class="hint-act"><button class="btn small" data-act="open-step" data-i="1">Mở Bước 2 trong tour</button></div>':'')+'</div>';
}

  var id=S.selected, q=S.q[S.qi], Q=QS[S.qi], res=S.results[id];
  var h='<div class="stack"><h2 id="rp-title" tabindex="-1" class="sr">Trả lời bằng lời của bạn</h2>';
  h+='<div><span class="lbl">Bậc người học (mức độ gợi ý)</span><div class="seg" role="radiogroup" aria-label="Bậc người học">'
    +LEVELS.map(function(l){ return '<button role="radio" data-act="level" data-id="'+l[0]+'" aria-checked="'+(S.level===l[0])+'">'+l[1]+'</button>'; }).join('')+'</div></div>';
  h+='<div><span class="lbl">Tiến độ câu hỏi (làm lần lượt)</span><div class="qchips">'
    +QS.map(function(_,i){
      var d=S.q[i], cls=d.done?(d.passed?' ok':' no'):'';
      var dis = i>0 && !S.q[i-1].done;

    }).join('')+'</div></div>';
  h+='<div class="card"><span class="lbl">Câu '+(S.qi+1)+'/2 · '+esc(Q.kind)+'</span><p class="qtext">'+esc(Q.text)+'</p></div>';
  if(q.attempts.length){
    h+='<div class="stack" style="gap:8px">'+q.attempts.map(function(a,k){
      var last=k===q.attempts.length-1;
      return '<details class="att"'+(last?' open':'')+'><summary>Lượt '+(k+1)+' <span class="pill '+(a.pass?'ok':'no')+'">'+(a.pass?'Đạt':'Chưa đạt')+'</span></summary>'

      +'<span class="muted" style="font-size:12.5px">Lượt '+(q.attempts.length+1)+'/3</span><span class="keyhint">Ctrl+Enter để nộp</span></div></div>';
  }else{
    h+='<div class="sample"><b>Đáp án mẫu do AI đề xuất:</b>'+esc(Q.sample)+'</div>'+deltaHTML(q,S.qi);
    if(S.qi<QS.length-1) h+='<button class="btn primary big" data-act="qsel" data-i="'+(S.qi+1)+'">Sang câu '+(S.qi+2)+' →</button>';
  }
  if(res){
    var info = res==='done' ? unlockInfo(id) : [];
    h+='<div class="result '+res+'" role="status">'
      +(res==='done'
        ? '<h3>Đã hoàn thành bài “'+esc(SLICES[id].vi)+'”</h3><p>Cả 2 câu hỏi đều đạt chuẩn.</p>'

      +(info.length?'<ul>'+info.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>':'')
      +(res==='fail'?'<div class="subrow"><button class="btn primary" data-act="relearn">Học lại từ đầu</button></div>':'')+'</div>';
  }
  return h+'</div>';
}

/* ============ chấm giả ============ */
function evaluate(qi, text){
  var t=text.toLowerCase().normalize('NFC');
  if(qi===0){
    var g=[/listproducts|service/.test(t), /vòng|từng sản phẩm|\bfor\b/.test(t), /findbyid|database|\bdb\b/.test(t)];
    var n=g.filter(Boolean).length;
    if(n>=2) return {pass:true, fb:"Đạt! Bạn đã nêu được các bước yêu cầu đi qua và việc mỗi bước làm."};
    if(g[0]) return {pass:false, fb:"Bạn đã nhắc đến tầng xử lý nghiệp vụ — đúng hướng, nhưng còn thiếu các bước còn lại."};
    if(g[1]) return {pass:false, fb:"Bạn đã để ý việc lặp qua từng sản phẩm — đúng ý, nhưng chưa đủ luồng đi."};
    if(g[2]) return {pass:false, fb:"Bạn đã nhắc đến việc hỏi database — đúng ý, nhưng chưa rõ yêu cầu đi qua những bước nào."};
    return {pass:false, fb:"Chưa thấy ý chính. Hãy thử kể theo thứ tự từ lúc yêu cầu vào đến lúc có dữ liệu."};
  }
  if(/(^|[^\d])201([^\d]|$)/.test(t)) return {pass:true, fb:"Chính xác! Bạn đã đếm đúng số lần hỏi database (201 lần)."};
  if(/\d/.test(t)) return {pass:false, fb:"Bạn đã tính ra một con số, nhưng chưa khớp với những gì code làm."};
  if(/findbyid|vòng|từng|mỗi|database|\bdb\b/.test(t)) return {pass:false, fb:"Bạn đã nhận ra việc hỏi database lặp lại — đúng ý, nhưng hãy tính ra con số cụ thể."};
  return {pass:false, fb:"Chưa thấy con số cụ thể. Hãy thử đếm số lần hỏi database."};
}

/* ============ hành động ============ */
function setHl(file, list){ S.fileIdx=file; S.hl=list; }
function stepRange(i){ var s=LESSON.steps[i]; return {file:s.file, from:s.from, to:s.to, cls:'step'}; }
function goRole(){ S.stage='role'; S.fileIdx=0; S.hl=[]; wantPanelFocus=true; render({resetRight:true}); }
function goStep(i, fromHint){
  S.rightTab='xray'; S.stage='tour'; S.step=i;
  setHl(LESSON.steps[i].file, [stepRange(i)]);
  if(fromHint) S.returnQ=true;
  wantPanelFocus=true;
  render({resetRight:true});
}
function goSummary(){ S.stage='summary'; S.hl=[]; wantPanelFocus=true; render({resetRight:true}); }
function nav(dir){
  if(S.stage==='role'){ if(dir>0) goStep(0); return; }
  if(S.stage==='tour'){
    if(dir>0){ S.step<LESSON.steps.length-1 ? goStep(S.step+1) : goSummary(); }
    else { S.step>0 ? goStep(S.step-1) : goRole(); }
    return;
  }
  if(dir<0) goStep(LESSON.steps.length-1);
}
function openSlice(id){
  var st=status(id);
  if(st==='locked'){ toast('Cần xong: '+names(missing(id))); return; }
  if(id!==PID){ toast('Bản vẽ chỉ có dữ liệu cho bài Xem danh sách sản phẩm'); return; }
  if(S.selected!==id){
    S.selected=id; S.rightTab='xray'; S.stage='role'; S.step=0; S.fileIdx=0; S.hl=[]; S.returnQ=false;
    wantPanelFocus=true;
    render({resetRight:true});
  }
}
function finishCheck(){
  if(S.q.every(function(q){ return q.done; }) && !S.results[S.selected]){
    var ok=S.q.every(function(q){ return q.passed; });
    S.results[S.selected]= ok ? 'done' : 'fail';
    S.fx[S.selected]=true;
    if(ok){
      var info=unlockInfo(S.selected);
      toast('Bài đã xong! '+info.join(' · '));
    }else toast('Bài chưa đạt. Bạn có thể bấm “Học lại từ đầu”.');
  }
}
function submit(){
  var q=S.q[S.qi]; if(q.done) return;
  var ta=$('#ans'); if(!ta) return;
  var text=ta.value.trim(); q.draft=ta.value;
  if(!text){ var e=$('#ansErr'); if(e) e.hidden=false; ta.focus(); return; }
  var ev=evaluate(S.qi, text), n=q.attempts.length+1;
  var att={text:text, pass:ev.pass, fb:ev.fb, hint:null};
  if(ev.pass){ q.done=true; q.passed=true; }
  else if(n>=3){ q.done=true; q.passed=false; }
  else att.hint=HINTS[S.level][n-1];
  q.attempts.push(att); q.draft='';
  finishCheck();
  wantAnsFocus=!q.done;
  render();
}

function positionPopup(popup, targetRect, prefer){
  popup.className = 'duo-popup'; // reset arrow classes
  var popW = 350, popH = popup.offsetHeight || 260;
  var margin = 16;
  var top, left;

  if (window.innerWidth >= 1024) {
    // Chế độ màn hình Desktop (3 cột song song)
    if (prefer === 'left') {
      left = targetRect.left - popW - margin;
      top = targetRect.top + 40;
      if (left < 16) {
        // Bên trái không đủ chỗ -> đảo sang bên phải
        left = targetRect.right + margin;
        popup.classList.add('arrow-left');
      } else {
        popup.classList.add('arrow-right');
      }
    } else if (prefer === 'right') {
      left = targetRect.right + margin;
      top = targetRect.top + 40;
      if (left + popW > window.innerWidth - 16) {
        // Bên phải không đủ chỗ -> đảo sang bên trái
        left = targetRect.left - popW - margin;
        popup.classList.add('arrow-right');
      } else {
        popup.classList.add('arrow-left');
      }
    } else {
      left = targetRect.left + (targetRect.width - popW) / 2;
      top = targetRect.bottom - popH - 30;
      popup.classList.add('arrow-top');
    }
  } else {
    // Chế độ màn hình Mobile / Tablet (1 cột dọc)
    left = Math.max(16, Math.min(window.innerWidth - popW - 16, targetRect.left + (targetRect.width - popW)/2));
    top = targetRect.bottom + margin;
    if (top + popH > window.innerHeight - 16) {
      top = Math.max(16, targetRect.top - popH - margin);
      popup.classList.add('arrow-bottom');
    } else {
      popup.classList.add('arrow-top');
    }
  }

  // Khóa biên không cho tràn ra ngoài viewport
  top = Math.max(16, Math.min(window.innerHeight - popH - 16, top));
  left = Math.max(16, Math.min(window.innerWidth - popW - 16, left));

  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

function selectWordInEditor(word){
  var cs = document.getElementById('codeScroll');
  if (!cs || !word) return null;
  var walker = document.createTreeWalker(cs, NodeFilter.SHOW_TEXT, null, false);
  var node;
  while ((node = walker.nextNode())) {
    var idx = node.textContent.indexOf(word);
    if (idx >= 0) {
      try {
        var r = document.createRange();
        r.setStart(node, idx);
        r.setEnd(node, idx + word.length);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
        return r;
      } catch(e){}
    }
  }
  return null;
}

  return {
    tag: 'Mã nguồn trong bài',
    title: 'Đoạn mã: ' + (rawText.length > 25 ? rawText.slice(0, 25) + '…' : rawText),
    desc: 'Đoạn mã thuộc bài học hiện tại. Hãy đối chiếu với các bước luồng thực thi trong tab X-Ray bên phải để hiểu rõ hơn.'
  };
}

function handleCodeSelection(){
  if (S.inTour && !(TOUR_STEPS[S.tourIdx] && TOUR_STEPS[S.tourIdx].allowSelect)) return;
  var sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
    closeCodeExplainBtn();
    return;
  }
  var codeScroll = document.getElementById('codeScroll');
  if (!codeScroll) { closeCodeExplainBtn(); return; }
  
  var range = sel.getRangeAt(0);
  if (!codeScroll.contains(range.commonAncestorContainer)) {
    closeCodeExplainBtn();
    return;
  }
  
  var rawSelected = sel.toString();
  var text = rawSelected.trim();
  if (!text) {
    closeCodeExplainBtn();
    return;
  }
  
  // Lấy dòng code chứa selection
  var startEl = range.startContainer.nodeType === Node.ELEMENT_NODE ? range.startContainer : range.startContainer.parentElement;
  var lnEl = startEl ? startEl.closest('.ln') : null;
  var lineNum = lnEl && lnEl.dataset ? +lnEl.dataset.n : 0;
  var lineText = lnEl ? (lnEl.querySelector('.tx') ? lnEl.querySelector('.tx').textContent : lnEl.textContent) : '';
  
  // Kiểm tra bôi nửa chữ (partial word check)
  var isPartial = false;
  var fullWord = text;
  var WORD_CHAR = /[a-zA-Z0-9_$]/;
  
  // 1. Kiểm tra trong text node đang chọn
  if (range.startContainer.nodeType === Node.TEXT_NODE) {
    var str = range.startContainer.textContent;
    var sOff = range.startOffset;
    var eOff = (range.startContainer === range.endContainer) ? range.endOffset : str.length;
    var l = sOff;
    while (l > 0 && WORD_CHAR.test(str.charAt(l - 1))) { l--; }
    var r = eOff;
    while (r < str.length && WORD_CHAR.test(str.charAt(r))) { r++; }
    var candidate = str.slice(l, r).trim();
    if (candidate.length > text.length && WORD_CHAR.test(text)) {
      isPartial = true;
      fullWord = candidate;
    }
  }
  
  // 2. Dò tìm từ hoàn chỉnh bao quanh trong lineText nếu chưa tìm thấy
  if (!isPartial && lineText) {
    var idx = lineText.indexOf(text);
    if (idx >= 0) {
      var l2 = idx;
      while (l2 > 0 && WORD_CHAR.test(lineText.charAt(l2 - 1))) { l2--; }
      var r2 = idx + text.length;
      while (r2 < lineText.length && WORD_CHAR.test(lineText.charAt(r2))) { r2++; }
      var foundWord = lineText.slice(l2, r2).trim();
      if (foundWord.length > text.length && WORD_CHAR.test(text)) {
        isPartial = true;
        fullWord = foundWord;
      }
    }
  }
  
  // Bôi 1-2 ký tự nằm trong từ dài hơn
  if (text.length <= 2 && WORD_CHAR.test(text) && fullWord.length > text.length) {
    isPartial = true;
  }
  
  pendingCodeSelection = {
    text: text,
    fullWord: fullWord,
    isPartial: isPartial,
    lineNum: lineNum,
    lineText: lineText,
    range: range.cloneRange()
  };
  
  closeCodeExplainPop();
  
  var btn = document.getElementById('codeExplainBtn');
  if (!btn) return;
  
  btn.hidden = false;
  
  var rect = range.getBoundingClientRect();
  var btnW = btn.offsetWidth || 88;
  var btnH = btn.offsetHeight || 26;
  
  var top = rect.top - btnH - 6;
  if (top < 60) {
    top = rect.bottom + 6;
  }
  var left = Math.max(16, Math.min(window.innerWidth - btnW - 16, rect.left + (rect.width - btnW) / 2));
  
  btn.style.top = top + 'px';
  btn.style.left = left + 'px';
  
  if (S.inTour && TOUR_STEPS[S.tourIdx] && TOUR_STEPS[S.tourIdx].allowSelect) {
    var stat = document.getElementById('tourSelectionStatus');
    if (stat) {
      stat.style.color = 'var(--accent)';
      stat.innerHTML = 'Đã chọn: <b>' + esc(text.length > 25 ? text.slice(0, 25) + '…' : text) + '</b>. Bấm nút <b>"Giải thích"</b> vừa xuất hiện!';
    }
  }
}

/* ============ popover ============ */
function openPopover(key, anchor){
  closePopover(false);
  var sk=SKILLS[key]; S.popover=key; lastAnchor=anchor;
  var el=document.createElement('div');
  el.className='pop'; el.id='pop'; el.setAttribute('role','dialog'); el.tabIndex=-1;
  el.setAttribute('aria-label','Thẻ khái niệm: '+sk.title);
  el.innerHTML='<button class="xbtn" data-act="pop-close" aria-label="Đóng thẻ khái niệm">'+X_ICON+'</button>'
    +'<h3>'+esc(sk.title)+' <code>'+key+'</code></h3>'
    +'<dl><dt>Là gì</dt><dd>'+md(sk.what)+'</dd><dt>Ví dụ đời thường</dt><dd>'+md(sk.eg)+'</dd><dt>Vì sao quan trọng</dt><dd>'+md(sk.why)+'</dd></dl>'
    +'<hr><div class="ai"><b>Trong repo này (AI):</b> '+md(sk.repo)
    +'<div class="hint-act"><button class="btn small" data-act="see-line">Xem dòng</button></div></div>';
  document.body.appendChild(el);
  var r=anchor.getBoundingClientRect(), w=el.offsetWidth, hgt=el.offsetHeight;
  var left=Math.min(Math.max(12, r.left), window.innerWidth-w-12);
  var top=r.bottom+8;
  if(top+hgt > window.innerHeight-12) top = (r.top-hgt-8 >= 12) ? r.top-hgt-8 : Math.max(12, window.innerHeight-hgt-12);
  el.style.left=left+'px'; el.style.top=top+'px';
  el.focus({preventScroll:true});
}
function closePopover(refocus){
  var el=document.getElementById('pop');
  if(el) el.remove();
  S.popover=null;
  if(refocus && lastAnchor && document.body.contains(lastAnchor)) lastAnchor.focus({preventScroll:true});
}

/* ============ cửa sổ nổi ============ */
function openModal(opener){
  if(S.modal) return;
  S.modal=true; modalPrev=opener||document.activeElement;
  $('#modalRoot').innerHTML='<div class="overlay" data-act="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" tabindex="-1">'
    +'<button class="xbtn" data-act="modal-close" aria-label="Đóng cửa sổ tổng quan">'+X_ICON+'</button>'+overviewInner('mTitle')+'</div></div>';
  $('#modalRoot .modal').focus();
}
function closeModal(){
  S.modal=false; $('#modalRoot').innerHTML='';
  if(modalPrev && document.body.contains(modalPrev)) modalPrev.focus({preventScroll:true});
}

/* ============ sự kiện ============ */
document.addEventListener('click', function(e){
  var pop=document.getElementById('pop');
  if(pop && !pop.contains(e.target) && !e.target.closest('[data-act="skill"]')) closePopover(false);
  var cpop=document.getElementById('codeExplainPop');
  var cbtn=document.getElementById('codeExplainBtn');
  if(cpop && !cpop.contains(e.target) && !e.target.closest('#codeScroll') && !(cbtn && cbtn.contains(e.target))) closeCodeExplainPop();
  if(cbtn && !cbtn.contains(e.target) && !e.target.closest('#codeScroll')) closeCodeExplainBtn();
  var t=e.target.closest('[data-act]'); if(!t) return;
  var h=HANDLERS[t.dataset.act]; if(h) h(t, e);
});

document.addEventListener('mouseup', function(e){
  var cbtn = document.getElementById('codeExplainBtn');
  if (cbtn && cbtn.contains(e.target)) return;
  var cpop = document.getElementById('codeExplainPop');
  if (cpop && cpop.contains(e.target)) return;
  var cs = document.getElementById('codeScroll');
  if (cs && (cs.contains(e.target) || e.target === cs)) {
    setTimeout(handleCodeSelection, 20);
  } else {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed) {
      closeCodeExplainBtn();
      closeCodeExplainPop();
    }
  }
});

document.addEventListener('keyup', function(e){
  if (e.key === 'Shift' || e.key.indexOf('Arrow') === 0) {
    var cs = document.getElementById('codeScroll');
    var sel = window.getSelection();
    if (cs && sel && sel.rangeCount > 0 && !sel.isCollapsed && cs.contains(sel.getRangeAt(0).commonAncestorContainer)) {
      setTimeout(handleCodeSelection, 20);
    }
  }
});

document.addEventListener('input', function(e){
  if(e.target.id==='ans'){ S.q[S.qi].draft=e.target.value; var er=$('#ansErr'); if(er) er.hidden=true; }
});

window.addEventListener('scroll', function(e){
  var pop=document.getElementById('pop');
  if(pop && !(e.target.nodeType===1 && pop.contains(e.target))) closePopover(false);
  var cpop=document.getElementById('codeExplainPop');
  if(cpop && !cpop.hidden && e.target && e.target.id === 'codeScroll') {
    closeCodeExplainPop();
  }
  var cbtn=document.getElementById('codeExplainBtn');
  if(cbtn && !cbtn.hidden && e.target && e.target.id === 'codeScroll') {
    closeCodeExplainBtn();
  }
}, true);

window.addEventListener('resize', function(){
  closePopover(false);
  closeCodeExplainBtn();
  closeCodeExplainPop();
  if(S.inTour) updateTourStep(S.tourIdx);
});

document.addEventListener('keydown', function(e){
  var t=e.target;
  if(e.key==='Escape'){
    var cbtn = $('#codeExplainBtn');
    if(cbtn && !cbtn.hidden){
      closeCodeExplainBtn();
      e.preventDefault();
      return;
    }
    var cp = $('#codeExplainPop');
    if(cp && !cp.hidden){
      closeCodeExplainPop();
      if(S.inTour && TOUR_STEPS[S.tourIdx] && TOUR_STEPS[S.tourIdx].allowSelect){
        var stat = document.getElementById('tourSelectionStatus');
        if (stat) {
          stat.style.color = 'var(--muted)';
          stat.innerHTML = 'Chưa tô chọn đoạn mã. Hãy kéo chuột trên khung code để thử!';
        }
      }
      e.preventDefault();
      return;
    }
    if(S.inTour){
      var p = $('#tourPopup');
      if(p){ p.classList.remove('duo-shake'); void p.offsetWidth; p.classList.add('duo-shake'); }
      toast('Vui lòng chọn "Tiếp theo..." hoặc "Bỏ qua" để tiếp tục.');
      e.preventDefault();
      return;
    }
    if(S.popover){ closePopover(true); e.preventDefault(); return; }
    if(S.modal){ closeModal(); e.preventDefault(); return; }
  }
  if(e.key==='Tab' && S.modal){
    var f=[].slice.call(document.querySelectorAll('#modalRoot button, #modalRoot [href], #modalRoot [tabindex]:not([tabindex="-1"])'));
    if(!f.length) return;
    var first=f[0], last=f[f.length-1];
    if(e.shiftKey && (t===first || t.classList.contains('modal'))){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && t===last){ e.preventDefault(); first.focus(); }
    return;
  }
  if(e.key==='Enter' && (e.ctrlKey||e.metaKey) && t.id==='ans'){ e.preventDefault(); submit(); return; }
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  var grp = t.closest && t.closest('[role="tablist"],[role="radiogroup"]');
  if(grp && /^(tab|radio)$/.test(t.getAttribute('role')||'')){
    var items=[].slice.call(grp.querySelectorAll('[role="'+t.getAttribute('role')+'"]:not(:disabled)'));
    var idx=items.indexOf(t); if(idx<0) return;
    var nx=items[(idx+(e.key==='ArrowRight'?1:-1)+items.length)%items.length];
    e.preventDefault(); nx.focus(); nx.click();
    return;
  }
  if(S.selected && S.rightTab==='xray' && !S.modal && !S.inTour){
    if(t.matches && t.matches('input,textarea,select,[contenteditable="true"]')) return;
    e.preventDefault(); nav(e.key==='ArrowRight' ? 1 : -1);
  }
});

/* ============ khởi động ============ */
try{ var saved=localStorage.getItem('sf-theme'); if(saved==='light'||saved==='dark') S.theme=saved; }catch(e){}
render();

// Tự động khởi động tour Duolingo ngay khi vào trang
setTimeout(function(){
  startTour(0);
}, 300);

})();
</script>
