name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGION: asia-southeast1
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  DEPLOY_SA: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT }}
  HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
  STAGING_SERVICE: simplifey-staging
  PROD_SERVICE: simplifey-prod

jobs:
  build-staging:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      SUPA_URL: ${{ vars.SUPABASE_DEV_URL || secrets.SUPABASE_DEV_URL }}
      SUPA_ANON: ${{ vars.SUPABASE_DEV_ANON_KEY || secrets.SUPABASE_DEV_ANON_KEY }}
    steps:
      - name: Kiểm biến bắt buộc
        run: |
          missing=""
          [ -z "$PROJECT_ID" ] && missing="$missing GCP_PROJECT_ID"
          [ -z "$SUPA_URL" ] && missing="$missing SUPABASE_DEV_URL"
          [ -z "$SUPA_ANON" ] && missing="$missing SUPABASE_DEV_ANON_KEY"
          if [ "$HAS_SA_KEY" != "true" ] && { [ -z "$WIF_PROVIDER" ] || [ -z "$DEPLOY_SA" ]; }; then
            missing="$missing GCP_SA_KEY(hoac GCP_WORKLOAD_IDENTITY_PROVIDER+GCP_SERVICE_ACCOUNT)"
          fi
          if [ -n "$missing" ]; then echo "::error::Thiếu biến hoặc secret:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - name: Đăng nhập GCP bằng khóa
        if: env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Đăng nhập GCP bằng WIF
        if: env.HAS_SA_KEY != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build và push image staging
        id: push
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/simplifey/app:${GITHUB_SHA}-staging"
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$SUPA_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPA_ANON" \
            --build-arg NEXT_PUBLIC_DEMO_MODE=true \
            -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"

  build-prod:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      SUPA_URL: ${{ vars.SUPABASE_PROD_URL || secrets.SUPABASE_PROD_URL }}
      SUPA_ANON: ${{ vars.SUPABASE_PROD_ANON_KEY || secrets.SUPABASE_PROD_ANON_KEY }}
      DEV_URL: ${{ vars.SUPABASE_DEV_URL || secrets.SUPABASE_DEV_URL }}
      ALLOW_SHARED: ${{ vars.ALLOW_SHARED_SUPABASE }}
    steps:
      - name: Kiểm biến bắt buộc và mô hình D2
        run: |
          missing=""
          [ -z "$PROJECT_ID" ] && missing="$missing GCP_PROJECT_ID"
          [ -z "$SUPA_URL" ] && missing="$missing SUPABASE_PROD_URL"
          [ -z "$SUPA_ANON" ] && missing="$missing SUPABASE_PROD_ANON_KEY"
          if [ -n "$missing" ]; then echo "::error::Thiếu biến hoặc secret:$missing"; exit 1; fi
          if [ "$SUPA_URL" = "$DEV_URL" ]; then
            if [ "$ALLOW_SHARED" = "true" ]; then
              echo "::warning::Staging và production đang dùng chung 1 project Supabase (ALLOW_SHARED_SUPABASE=true)."
            else
              echo "::error::SUPABASE_PROD_URL trùng SUPABASE_DEV_URL (mô hình D2 cần 2 project)."; exit 1
            fi
          fi
      - uses: actions/checkout@v4
      - name: Đăng nhập GCP bằng khóa
        if: env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Đăng nhập GCP bằng WIF
        if: env.HAS_SA_KEY != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Build và push image production
        id: push
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/simplifey/app:${GITHUB_SHA}-prod"
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$SUPA_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPA_ANON" \
            --build-arg NEXT_PUBLIC_DEMO_MODE=false \
            -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"

  staging:
    runs-on: ubuntu-latest
    needs: build-staging
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Đăng nhập GCP bằng khóa
        if: env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Đăng nhập GCP bằng WIF
        if: env.HAS_SA_KEY != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy staging theo digest (không đổi cấu hình service)
        id: deploy
        run: |
          gcloud run deploy "$STAGING_SERVICE" --image "${{ needs.build-staging.outputs.image }}" --region "$REGION" --project "$PROJECT_ID" --quiet
          URL=$(gcloud run services describe "$STAGING_SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  smoke:
    runs-on: ubuntu-latest
    needs: staging
    env:
      STAGING_URL: ${{ needs.staging.outputs.url }}
      DEMO_REPO_URL: ${{ vars.DEMO_REPO_URL }}
      SUPA_URL: ${{ vars.SUPABASE_DEV_URL || secrets.SUPABASE_DEV_URL }}
      SUPA_ANON: ${{ vars.SUPABASE_DEV_ANON_KEY || secrets.SUPABASE_DEV_ANON_KEY }}
      BOT_EMAIL: ${{ secrets.SMOKE_BOT_EMAIL }}
      BOT_PASSWORD: ${{ secrets.SMOKE_BOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: GET /api/health
        run: |
          BODY=$(curl -fsS --max-time 10 "$STAGING_URL/api/health")
          [ "$BODY" = "ok" ] || { echo "::error::/api/health trả '$BODY'"; exit 1; }
      - name: POST /api/ingest repo demo (chỉ khi có DEMO_REPO_URL)
        if: env.DEMO_REPO_URL != ''
        run: |
          [ -n "$BOT_EMAIL" ] && [ -n "$BOT_PASSWORD" ] || { echo "::error::Thiếu SMOKE_BOT_EMAIL hoặc SMOKE_BOT_PASSWORD"; exit 1; }
          TOKEN=$(curl -fsS -X POST "$SUPA_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPA_ANON" -H "Content-Type: application/json" \
            -d "$(jq -n --arg e "$BOT_EMAIL" --arg p "$BOT_PASSWORD" '{email:$e,password:$p}')" | jq -r '.access_token')
          echo "::add-mask::$TOKEN"
          [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ] || { echo "::error::Không lấy được token bot"; exit 1; }
          MIN=$(grep -oE 'DISPLAY_MIN_NODES: *[0-9]+' src/contracts/config.ts | grep -oE '[0-9]+$')
          RES=$(curl -sS --max-time 120 -o res.json -w '%{http_code}' -X POST "$STAGING_URL/api/ingest" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg u "$DEMO_REPO_URL" '{repo_url:$u}')")
          [ "$RES" = "200" ] || { echo "::error::/api/ingest trả HTTP $RES"; exit 1; }
          SID=$(jq -r '.session_id' res.json)
          N=$(jq '.result.nodes | length' res.json)
          [ -n "$SID" ] && [ "$SID" != "null" ] || { echo "::error::Không có session_id"; exit 1; }
          [ "$N" -ge "$MIN" ] || { echo "::error::Chỉ có $N bài, cần ít nhất $MIN"; exit 1; }
          echo "Smoke ingest đạt: $N bài"

  production:
    runs-on: ubuntu-latest
    needs: [build-prod, smoke]
    environment: production
    steps:
      - name: Đăng nhập GCP bằng khóa
        if: env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Đăng nhập GCP bằng WIF
        if: env.HAS_SA_KEY != 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy production theo digest (không đổi cấu hình service)
        run: gcloud run deploy "$PROD_SERVICE" --image "${{ needs.build-prod.outputs.image }}" --region "$REGION" --project "$PROJECT_ID" --quiet
      - name: GET /api/health trên production
        run: |
          URL=$(gcloud run services describe "$PROD_SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          BODY=$(curl -fsS --max-time 20 "$URL/api/health") || BODY="(lỗi kết nối)"
          if [ "$BODY" != "ok" ]; then
            echo "::error::/api/health production trả '$BODY'."
            echo "Rollback: Cloud Run Console ⇒ $PROD_SERVICE ⇒ Revisions ⇒ Manage Traffic ⇒ 100% về revision cũ."
            exit 1
          fi
